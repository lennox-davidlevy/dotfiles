---
- name: Bootstrap Fedora Dev Environment
  hosts: localhost
  become: true
  vars_files:
    - packages.yml
  tasks:
    - name: System setup
      block:
        - name: Update system packages
          ansible.builtin.dnf:
            name: "*"
            state: latest # noqa package-latest
          tags: system-update

        - name: Enable COPR repos
          community.general.copr:
            name: "{{ item }}"
            state: enabled
          loop: "{{ copr_repositories }}"

    - name: Package Installation
      block:
        - name: Install core packages
          ansible.builtin.dnf:
            name: "{{ packages.core }}"
            state: present

        - name: Install editor packages
          ansible.builtin.dnf:
            name: "{{ packages.editors }}"
            state: present

        - name: Install development packages
          ansible.builtin.dnf:
            name: "{{ packages.development }}"
            state: present

        - name: Install desktop packages
          ansible.builtin.dnf:
            name: "{{ packages.desktop }}"
            state: present
    - name: Debug all user-related variables
      ansible.builtin.debug:
        msg:
          - "ansible_user_id: {{ ansible_user_id }}"
          - "ansible_user_dir: {{ ansible_user_dir }}"
          - "ansible_env.HOME: {{ ansible_env.HOME }}"
          - "ansible_env.USER: {{ ansible_env.USER }}"
          - "ansible_real_user_id: {{ ansible_real_user_id | default('not set') }}"
          - "ansible_become_user: {{ ansible_become_user | default('not set') }}"
      become: true
      become_user: "{{ ansible_user_id }}"
    - name: Symlink Config
      become: true
      become_user: david
      block:
        - name: Symlink neovim config
          block:
            - name: Remove existing nvim config if it exists
              ansible.builtin.file:
                path: "/home/david/.config/nvim"
                state: absent
            - name: Create nvim config symlink
              ansible.builtin.file:
                src: "{{ playbook_dir }}/../config/nvim"
                dest: "/home/david/.config/nvim"
                state: link
