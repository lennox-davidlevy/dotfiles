---
- name: Gather initial facts
  hosts: localhost
  gather_facts: true
  become: false
  tasks:
    - name: Store the actual user
      ansible.builtin.set_fact:
        actual_user: "{{ ansible_user_id }}"
        actual_user_home: "{{ ansible_user_dir }}"

- name: Bootstrap Fedora Dev Environment
  hosts: localhost
  become: true
  vars_files:
    - packages.yml
  tasks:
    - name: System setup
      block:
        - name: Update system packages
          ansible.builtin.dnf:
            name: "*"
            state: latest # noqa package-latest
          tags: system-update

        - name: Enable COPR repos
          community.general.copr:
            name: "{{ item }}"
            state: enabled
          loop: "{{ copr_repositories }}"

    - name: Package Installation
      block:
        - name: Install core packages
          ansible.builtin.dnf:
            name: "{{ packages.core }}"
            state: present

        - name: Install editor packages
          ansible.builtin.dnf:
            name: "{{ packages.editors }}"
            state: present

        - name: Install development packages
          ansible.builtin.dnf:
            name: "{{ packages.development }}"
            state: present

        - name: Install desktop packages
          ansible.builtin.dnf:
            name: "{{ packages.desktop }}"
            state: present

    - name: Symlink Config
      become: true
      become_user: "{{ actual_user }}"
      block:
        - name: Symlink neovim config
          block:
            - name: Remove existing nvim config if it exists
              ansible.builtin.file:
                path: "{{ actual_user_home }}/.config/nvim"
                state: absent
            - name: Create nvim config symlink
              ansible.builtin.file:
                src: "{{ playbook_dir }}/../config/nvim"
                dest: "{{ actual_user_home }}/.config/nvim"
                state: link

        - name: Symlink zsh config
          block:
            - name: Remove existing .zshrc.bak
              ansible.builtin.file:
                path: "{{ actual_user_home }}/.zshrc.bak"
                state: absent

            - name: Check if .zshrc exists
              ansible.builtin.stat:
                path: "{{ actual_user_home }}/.zshrc"
              register: zshrc_exists

            - name: Copy .zshrc to .zshrc.bak
              ansible.builtin.copy:
                src: "{{ actual_user_home }}/.zshrc"
                dest: "{{ actual_user_home }}/.zshrc.bak"
                remote_src: true
                mode: preserve
              when: zshrc_exists.stat.exists

            - name: Remove existing .zshrc
              ansible.builtin.file:
                path: "{{ actual_user_home }}/.zshrc"
                state: absent
              when: zshrc_exists.stat.exists

            - name: Create .zshrc symlink
              ansible.builtin.file:
                src: "{{ playbook_dir }}/../shell/.zshrc"
                dest: "{{ actual_user_home }}/.zshrc"
                state: link

    - name: User environment setup
      become: true
      become_user: "{{ actual_user }}"
      block:
        - name: Install oh my zsh
          ansible.builtin.shell:
            cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
            creates: "{{ actual_user_home }}/.oh-my-zsh"

        - name: Install custom fonts
          block:
            - name: Create fonts directory
              ansible.builtin.file:
                path: "{{ actual_user_home }}/.local/share/fonts/"
                state: directory
                mode: "0755"

            - name: Copy font files
              ansible.builtin.copy:
                src: "{{ playbook_dir }}/../fonts/"
                dest: "{{ actual_user_home }}/.local/share/fonts/"
                mode: "0644"
                backup: false

            - name: Update font cache
              ansible.builtin.command:
                cmd: fc-cache -f
              changed_when: true

    - name: Setup environment
      become: true
      block:
        - name: Get zsh path
          ansible.builtin.command: which zsh
          register: zsh_path
          changed_when: false
          become: false

        - name: Change user's shell to zsh
          ansible.builtin.user:
            name: "{{ actual_user }}"
            shell: "{{ zsh_path.stdout }}"
