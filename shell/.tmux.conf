# Theme
source-file "${HOME}/.tmux-themepack/powerline/block/gray.tmuxtheme"
set -g status-right "#[fg=colour235,bg=colour233]#[fg=colour240,bg=colour235]#[fg=colour240,bg=colour235]#[fg=colour233,bg=colour240] %d-%b-%y #[fg=colour245,bg=colour240]"
set -g status-left "#[fg=colour233,bg=colour245,bold] #S #[fg=colour245,bg=colour240,nobold]#[fg=colour233,bg=colour240] #(whoami) #[fg=colour240,bg=colour235]#[fg=colour235,bg=colour233,nobold]"

# Nvim
set-option -g focus-events on

# Select and copy
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# macOS clipboard integration
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Shell
set-option -g default-shell /bin/zsh
set -g base-index 1
set-option -g detach-on-destroy off

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# General
# tmux-256color advertises italic, undercurl, and modern SGR attrs (screen-256color does not).
# Without italic capability, opencode/opentui paints background highlights behind comments
# and styled tokens as a fallback. See https://github.com/anomalyco/opencode/issues/6630.
set -g default-terminal "tmux-256color"
set-option -ga terminal-features ",xterm-256color:RGB"
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g monitor-activity on

# Windows
bind C-c new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key C-v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key C-s split-window -v -c "#{pane_current_path}"

# bind-key C-, command-prompt "rename-window '%%'"

# Shift arrow to switch windows
# bind -n S-Left  previous-window
# bind -n S-Right next-window

bind C-P  previous-window
bind C-W next-window

# Custom bindings for Ctrl+J/Ctrl+K window navigation (for keyboard macros)
bind-key -T prefix C-p previous-window
bind-key -T prefix C-w next-window

# Sessions
bind C-n new-session
bind n new-session
bind C-m command-prompt "rename-session '%%'"
bind m command-prompt "rename-session '%%'"

# Pane
bind C-x kill-pane
unbind C-z
bind C-z resize-pane -Z

# Pane resize with prefix + arrow keys (repeatable, step of 5)
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# Detach
bind C-q detach

# Choose Tree - styled picker
# Note: choose-tree auto-renders "SESSION_NAME:" / "INDEX:" as a built-in label;
# the -F format only adds EXTRAS to the right of that label.
#   Sessions: window count + green attached badge
#   Windows:  bold name + red flags + green [command] (hidden when running zsh)
# The "is it zsh?" check uses an anchored substitution (s/^zsh$//) instead of
# #{!=:...} because the equality operator inside a nested conditional did not
# behave reliably in this tmux version. The s/// trick is portable and clear:
# strip "zsh" from the command; if anything is left, render the brackets.
%hidden TREE_FORMAT="#{?session_format,#[fg=colour244]#{session_windows} windows#{?session_attached, #[fg=colour46 bold]● attached,},#[fg=colour255 bold]#{window_name}#[default]#{?window_flags,#[fg=colour203]#{window_flags}#[default],}#{?#{s/^zsh$//:#{pane_current_command}}, #[fg=colour78][#{pane_current_command}]#[default],}}"

bind C-l choose-tree -wZ -F "$TREE_FORMAT"
bind l choose-tree -wZ -F "$TREE_FORMAT"

# Picker highlight + message styling
set -g mode-style "fg=colour39,bg=colour237,bold"
set -g message-style "fg=colour255,bg=colour237,bold"
set -g message-command-style "fg=colour255,bg=colour237"

# copy mode
unbind [
bind C-[ copy-mode

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

#VIM-NAVIGATOR
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# Commented out to allow Ctrl+J/K to work with prefix for window navigation
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

if-shell '[ -n "$SSH_CLIENT" ]' \
    'set -g pane-border-style "fg=blue"' \
    'set -g pane-border-style "fg=white"'

set -g allow-passthrough on
